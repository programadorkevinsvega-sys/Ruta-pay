name: payvia-shared-infra

services:
  node-exporter:
    image: prom/node-exporter:v1.10.2
    restart: unless-stopped
    command: ["--path.procfs=/host/proc", "--path.sysfs=/host/sys", "--path.rootfs=/host"]
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    networks: [monitoring]

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      - --web.config.file=/run/secrets/prometheus-web.yml
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - ./infra/.local/secrets/platform_metrics_token:/run/secrets/platform_metrics_token:ro
      - ./infra/.local/secrets/pasarela_metrics_token:/run/secrets/pasarela_metrics_token:ro
      - ./infra/.local/secrets/prometheus-web.yml:/run/secrets/prometheus-web.yml:ro
      - ./infra/.local/secrets/prometheus_admin_password:/run/secrets/prometheus_admin_password:ro
      - ./infra/.local/secrets/nats_surveyor_http_password:/run/secrets/nats_surveyor_http_password:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [postgres-exporter, redis-exporter, nats-exporter, nats-surveyor, node-exporter, otel-collector]
    networks: [monitoring]

  alertmanager:
    image: prom/alertmanager:v0.34.2
    restart: unless-stopped
    profiles: [notifications]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://localhost:9093/
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./infra/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./infra/.local/secrets/telegram_bot_token:/run/secrets/telegram_bot_token:ro
      - ./infra/.local/secrets/telegram_chat_id:/run/secrets/telegram_chat_id:ro
      - alertmanager_data:/alertmanager
    networks: [monitoring]

  loki:
    image: grafana/loki:3.7.7
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./infra/loki/config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks: [monitoring]

  tempo:
    image: grafana/tempo:3.1.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./infra/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    networks: [monitoring]

  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.162.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on: [loki, tempo]
    networks: [monitoring]

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?run infra/prepare-dev-secrets.sh first}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run infra/prepare-dev-secrets.sh first}
      PROMETHEUS_ADMIN_USER: ${PROMETHEUS_ADMIN_USER:?run infra/prepare-dev-secrets.sh first}
      PROMETHEUS_ADMIN_PASSWORD: ${PROMETHEUS_ADMIN_PASSWORD:?run infra/prepare-dev-secrets.sh first}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki, tempo]
    networks: [monitoring]

volumes:
  prometheus_data:
  alertmanager_data:
  loki_data:
  tempo_data:
  grafana_data:

networks:
  monitoring:
