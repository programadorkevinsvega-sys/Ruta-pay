name: payvia-shared-infra

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?run infra/prepare-dev-secrets.sh first}
      POSTGRES_USER: ${POSTGRES_USER:?run infra/prepare-dev-secrets.sh first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run infra/prepare-dev-secrets.sh first}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD:?run infra/prepare-dev-secrets.sh first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [data, postgres_admin]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
      - ./infra/.local/secrets/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks: [data, redis_admin]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(awk '$$1 == \"requirepass\" {print $$2}' /usr/local/etc/redis/redis.conf)\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
  nats:
    image: nats:2.15.1-alpine
    restart: unless-stopped
    command: ["--config=/etc/nats/nats-server.conf"]
    ports:
      - "127.0.0.1:4222:4222"
    volumes:
      - nats_data:/data
      - ./infra/.local/secrets/nats-server.conf:/etc/nats/nats-server.conf:ro
    networks: [messaging]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:?run infra/prepare-dev-secrets.sh first}?sslmode=disable
      DATA_SOURCE_USER: postgres_exporter
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:?run infra/prepare-dev-secrets.sh first}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data, monitoring]

  redis-exporter:
    image: oliver006/redis_exporter:v1.91.1
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run infra/prepare-dev-secrets.sh first}
    depends_on:
      redis:
        condition: service_healthy
    networks: [data, monitoring]

  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.17.3
    restart: unless-stopped
    command: ["-varz", "-connz", "-subz", "-routez", "-gatewayz", "-leafz", "-jsz=all", "http://nats:8222"]
    depends_on: [nats]
    networks: [messaging, monitoring]

  nats-surveyor:
    image: natsio/nats-surveyor:0.9.11
    restart: unless-stopped
    environment:
      NATS_SURVEYOR_SERVERS: nats://nats:4222
      NATS_SURVEYOR_USER: ${NATS_SURVEYOR_USER:?run infra/prepare-dev-secrets.sh first}
      NATS_SURVEYOR_PASSWORD: ${NATS_SURVEYOR_PASSWORD:?run infra/prepare-dev-secrets.sh first}
      NATS_SURVEYOR_COUNT: "1"
      NATS_SURVEYOR_JSZ: all
      NATS_SURVEYOR_JSZ_LEADERS_ONLY: "true"
      NATS_SURVEYOR_HTTP_USER: ${NATS_SURVEYOR_HTTP_USER:?run infra/prepare-dev-secrets.sh first}
      NATS_SURVEYOR_HTTP_PASS: ${NATS_SURVEYOR_HTTP_PASSWORD:?run infra/prepare-dev-secrets.sh first}
    depends_on: [nats]
    networks: [messaging, monitoring]

  pgadmin:
    image: dpage/pgadmin4:9.17
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?run infra/prepare-dev-secrets.sh first}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?run infra/prepare-dev-secrets.sh first}
      PGADMIN_DISABLE_POSTFIX: "true"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks: [postgres_admin]

  redisinsight:
    image: redis/redisinsight:3.8.0
    restart: unless-stopped
    environment:
      RI_APP_HOST: 0.0.0.0
      RI_APP_PORT: "5540"
      RI_ENCRYPTION_KEY: ${REDISINSIGHT_ENCRYPTION_KEY:?run infra/prepare-dev-secrets.sh first}
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: payvia-dev
      RI_REDIS_USERNAME: default
      RI_REDIS_PASSWORD: ${REDIS_PASSWORD:?run infra/prepare-dev-secrets.sh first}
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks: [redis_admin]

  admin-auth-proxy:
    image: nginx:1.30.6-alpine3.24
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:5540:5540"
    volumes:
      - ./infra/nginx/monitoring-auth.conf:/etc/nginx/nginx.conf:ro
      - ./infra/.local/secrets/infra-ui.htpasswd:/etc/nginx/secrets/infra-ui.htpasswd:ro
      - ./infra/nginx/landing.html:/usr/share/nginx/html/index.html:ro
    depends_on: [loki, tempo, redisinsight]
    networks: [monitoring, redis_admin]

  node-exporter:
    image: prom/node-exporter:v1.10.2
    restart: unless-stopped
    command: ["--path.procfs=/host/proc", "--path.sysfs=/host/sys", "--path.rootfs=/host"]
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    networks: [monitoring]

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      - --web.config.file=/run/secrets/prometheus-web.yml
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - ./infra/.local/secrets/platform_metrics_token:/run/secrets/platform_metrics_token:ro
      - ./infra/.local/secrets/pasarela_metrics_token:/run/secrets/pasarela_metrics_token:ro
      - ./infra/.local/secrets/prometheus-web.yml:/run/secrets/prometheus-web.yml:ro
      - ./infra/.local/secrets/prometheus_admin_password:/run/secrets/prometheus_admin_password:ro
      - ./infra/.local/secrets/nats_surveyor_http_password:/run/secrets/nats_surveyor_http_password:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [postgres-exporter, redis-exporter, nats-exporter, nats-surveyor, node-exporter, otel-collector]
    networks: [monitoring]

  loki:
    image: grafana/loki:3.7.7
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./infra/loki/config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks: [monitoring]

  tempo:
    image: grafana/tempo:3.1.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./infra/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    networks: [monitoring]

  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.162.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on: [loki, tempo]
    networks: [monitoring]

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?run infra/prepare-dev-secrets.sh first}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run infra/prepare-dev-secrets.sh first}
      PROMETHEUS_ADMIN_USER: ${PROMETHEUS_ADMIN_USER:?run infra/prepare-dev-secrets.sh first}
      PROMETHEUS_ADMIN_PASSWORD: ${PROMETHEUS_ADMIN_PASSWORD:?run infra/prepare-dev-secrets.sh first}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki, tempo]
    networks: [monitoring]

volumes:
  postgres_data:
  redis_data:
  nats_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
  pgadmin_data:
  redisinsight_data:

networks:
  data:
  messaging:
  monitoring:
  postgres_admin:
  redis_admin:
