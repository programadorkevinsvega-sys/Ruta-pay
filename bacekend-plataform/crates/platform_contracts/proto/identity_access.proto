syntax = "proto3";
package payvia.platform.identity_access.v1;

service IdentityAccess {
  rpc RegisterTenantUser (RegisterTenantUserRequest) returns (RegisterTenantUserResponse);
  rpc CreateTenantSession (CreateTenantSessionRequest) returns (CreateTenantSessionResponse);
  rpc RevokeSession (RevokeSessionRequest) returns (RevokeSessionResponse);
  rpc ValidateTenantSession (ValidateTenantSessionRequest) returns (ValidateTenantSessionResponse);
  rpc CreateApiKey (CreateApiKeyRequest) returns (CreateApiKeyResponse);
  rpc ListApiKeys (ListApiKeysRequest) returns (ListApiKeysResponse);
  rpc RevokeApiKey (RevokeApiKeyRequest) returns (RevokeApiKeyResponse);
}

message RegisterTenantUserRequest {
  string email = 1;
  string password = 2;
  string correlation_id = 3;
}

message RegisterTenantUserResponse {
  string user_id = 1;
}

message CreateTenantSessionRequest {
  string email = 1;
  string password = 2;
  string correlation_id = 3;
  string source_ip = 4;
}

message CreateTenantSessionResponse {
  string session_token = 1;
  string csrf_token = 2;
  string expires_at = 3;
  string user_id = 4;
}

message RevokeSessionRequest {
  string session_token = 1;
  string correlation_id = 2;
}

message RevokeSessionResponse {}

message ValidateTenantSessionRequest {
  string session_token = 1;
  string csrf_token = 2;
  string correlation_id = 3;
}

message ValidateTenantSessionResponse {
  string user_id = 1;
}

message CreateApiKeyRequest {
  string session_token = 1;
  string tenant_id = 2;
  string name = 3;
  string environment = 4;
  repeated string scopes = 5;
  string correlation_id = 6;
}

message CreateApiKeyResponse {
  string key_id = 1;
  string secret_once = 2;
  string prefix = 3;
  string environment = 4;
  repeated string scopes = 5;
  string created_at = 6;
}

message ListApiKeysRequest {
  string session_token = 1;
  string tenant_id = 2;
  string correlation_id = 3;
}

message ApiKeyMetadata {
  string key_id = 1;
  string name = 2;
  string prefix = 3;
  string environment = 4;
  repeated string scopes = 5;
  string status = 6;
  string created_at = 7;
  string revoked_at = 8;
}

message ListApiKeysResponse {
  repeated ApiKeyMetadata api_keys = 1;
}

message RevokeApiKeyRequest {
  string session_token = 1;
  string key_id = 2;
  string tenant_id = 3;
  string correlation_id = 4;
}

message RevokeApiKeyResponse {}
