syntax = "proto3";
package payvia.platform.catalog_pricing.v1;

service CatalogPricing {
  rpc CreatePlan (CreatePlanRequest) returns (PlanResponse);
  rpc PublishPriceVersion (PublishPriceVersionRequest) returns (PriceVersionResponse);
  rpc GetPriceVersion (GetPriceVersionRequest) returns (PriceVersionResponse);
  rpc ListPlans (ListPlansRequest) returns (ListPlansResponse);
}
message CreatePlanRequest {
  string session_token = 1;
  string csrf_token = 2;
  string slug = 3;
  string name = 4;
  string description = 5;
  string correlation_id = 6;
}
message PlanResponse {
  string plan_id = 1;
  string slug = 2;
  string name = 3;
  string description = 4;
  string status = 5;
  string created_at = 6;
}
message PublishPriceVersionRequest {
  string session_token = 1;
  string csrf_token = 2;
  string plan_id = 3;
  string currency = 4;
  int64 amount_minor = 5;
  string period_unit = 6;
  uint32 interval_count = 7;
  string effective_from = 8;
  string effective_until = 9;
  string correlation_id = 10;
}
message PriceVersionResponse {
  string price_version_id = 1;
  string plan_id = 2;
  uint32 version = 3;
  string currency = 4;
  int64 amount_minor = 5;
  string period_unit = 6;
  uint32 interval_count = 7;
  string effective_from = 8;
  string effective_until = 9;
  string published_at = 10;
}
message GetPriceVersionRequest { string price_version_id = 1; }
message ListPlansRequest {
  string session_token = 1;
  string csrf_token = 2;
  string correlation_id = 3;
}
message ListPlansResponse { repeated PlanResponse plans = 1; }
