syntax = "proto3";
package payvia.platform.payments.v1;

service Payments {
  rpc CreatePaymentIntent (CreatePaymentIntentRequest) returns (CreatePaymentIntentResponse);
  rpc GetPaymentIntent (GetPaymentIntentRequest) returns (GetPaymentIntentResponse);
  rpc CreatePaymentAttempt (CreatePaymentAttemptRequest) returns (CreatePaymentAttemptResponse);
  rpc ListPaymentAttempts (ListPaymentAttemptsRequest) returns (ListPaymentAttemptsResponse);
  rpc ListPaymentTransactions (ListPaymentTransactionsRequest) returns (ListPaymentTransactionsResponse);
  rpc UpdatePaymentIntentStatus (UpdatePaymentIntentStatusRequest) returns (UpdatePaymentIntentStatusResponse);
}

message PaymentIntent {
  string payment_intent_id = 1;
  string tenant_id = 2;
  string environment = 3;
  int64 amount_minor = 4;
  string currency = 5;
  string payment_method_type = 6;
  string merchant_reference = 7;
  string status = 8;
  string created_at = 9;
}

message CreatePaymentIntentRequest {
  string api_key_secret = 1;
  string tenant_id = 2;
  string environment = 3;
  int64 amount_minor = 4;
  string currency = 5;
  string payment_method_type = 6;
  string merchant_reference = 7;
  string idempotency_key = 8;
  string correlation_id = 9;
}

message CreatePaymentIntentResponse {
  PaymentIntent payment_intent = 1;
  bool replayed = 2;
}

message GetPaymentIntentRequest {
  string api_key_secret = 1;
  string tenant_id = 2;
  string environment = 3;
  string payment_intent_id = 4;
  string correlation_id = 5;
}

message GetPaymentIntentResponse {
  PaymentIntent payment_intent = 1;
}

message CreatePaymentAttemptRequest {
  string api_key_secret = 1;
  string tenant_id = 2;
  string environment = 3;
  string payment_intent_id = 4;
  string provider_code = 5;
  string provider_account_reference = 6;
  string idempotency_key = 7;
  string correlation_id = 8;
}

message PaymentAttempt {
  string attempt_id = 1;
  string tenant_id = 2;
  string environment = 3;
  string payment_intent_id = 4;
  int32 attempt_number = 5;
  string provider_code = 6;
  string provider_account_reference = 7;
  string status = 8;
  int64 aggregate_version = 9;
  string created_at = 10;
  string updated_at = 11;
}

message CreatePaymentAttemptResponse {
  PaymentAttempt attempt = 1;
  bool replayed = 2;
}

message ListPaymentAttemptsRequest {
  string api_key_secret = 1;
  string tenant_id = 2;
  string environment = 3;
  string payment_intent_id = 4;
  int32 limit = 5;
  string correlation_id = 6;
}

message ListPaymentAttemptsResponse {
  repeated PaymentAttempt attempts = 1;
}

message PaymentTransaction {
  string transaction_id = 1;
  string tenant_id = 2;
  string environment = 3;
  string payment_intent_id = 4;
  string payment_attempt_id = 5;
  string provider_code = 6;
  string provider_account_reference = 7;
  string provider_transaction_reference = 8;
  int64 amount_minor = 9;
  string currency = 10;
  string status = 11;
  int64 aggregate_version = 12;
  string created_at = 13;
  string updated_at = 14;
}

message ListPaymentTransactionsRequest {
  string api_key_secret = 1;
  string tenant_id = 2;
  string environment = 3;
  string payment_intent_id = 4;
  int32 limit = 5;
  string correlation_id = 6;
}

message ListPaymentTransactionsResponse {
  repeated PaymentTransaction transactions = 1;
}

message UpdatePaymentIntentStatusRequest {
  string api_key_secret = 1;
  string tenant_id = 2;
  string environment = 3;
  string payment_intent_id = 4;
  string payment_attempt_id = 5;
  string status = 6;
  int64 expected_version = 7;
  string correlation_id = 8;
}

message UpdatePaymentIntentStatusResponse {
  PaymentIntent payment_intent = 1;
  int64 aggregate_version = 2;
}

// This is a normalized integration contract, not proof of producer authenticity.
// It must only be accepted after gateway-side provider verification and an
// authenticated cross-backend transport are in place. No RPC accepts it yet.
enum NormalizedProviderPaymentStatus {
  NORMALIZED_PROVIDER_PAYMENT_STATUS_UNSPECIFIED = 0;
  NORMALIZED_PROVIDER_PAYMENT_STATUS_PROCESSING = 1;
  NORMALIZED_PROVIDER_PAYMENT_STATUS_REQUIRES_ACTION = 2;
  NORMALIZED_PROVIDER_PAYMENT_STATUS_AUTHORIZED = 3;
  NORMALIZED_PROVIDER_PAYMENT_STATUS_SUCCEEDED = 4;
  NORMALIZED_PROVIDER_PAYMENT_STATUS_FAILED = 5;
}

message NormalizedProviderPaymentEventV1 {
  uint32 schema_version = 1;
  string provider_code = 2;
  string provider_account_reference = 3;
  string provider_event_id = 4;
  string tenant_id = 5;
  string environment = 6;
  string payment_intent_id = 7;
  string payment_attempt_id = 8;
  string provider_transaction_reference = 9;
  NormalizedProviderPaymentStatus status = 10;
  int64 occurred_at_unix_millis = 11;
  string correlation_id = 12;
  bytes payload_sha256 = 13;
  string event_id = 14;
}
