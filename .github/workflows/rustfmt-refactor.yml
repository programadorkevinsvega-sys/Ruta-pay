name: Temporary Rust formatting for refactor

on:
  push:
    branches:
      - refactor/rust-files-under-200-lines

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Apply workspace rustfmt
        run: cargo fmt --all
      - name: Commit formatted Rust sources
        run: |
          if git diff --quiet; then
            echo "Rust sources already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style(rust): apply workspace rustfmt"
          git push origin "HEAD:${GITHUB_REF_NAME}"
