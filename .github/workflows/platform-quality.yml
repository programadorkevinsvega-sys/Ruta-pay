name: Platform Rust quality

concurrency:
  group: platform-quality-phase3-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'bacekend-plataform/**'
      - 'bacekend-pasarela/**'
      - 'frontends/**'
      - 'AGENTS.md'
      - 'PROJECT_RULES.md'
      - 'ROADMAP.md'
      - '.github/workflows/platform-quality.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'bacekend-plataform/**'
      - 'bacekend-pasarela/**'
      - 'frontends/**'
      - 'AGENTS.md'
      - 'PROJECT_RULES.md'
      - 'ROADMAP.md'
      - '.github/workflows/platform-quality.yml'

jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: payvia_test
          POSTGRES_USER: payvia_test
          POSTGRES_PASSWORD: payvia-postgres-${{ github.run_id }}-${{ github.run_attempt }}-integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payvia_test -d payvia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_PASSWORD: payvia-redis-${{ github.run_id }}-${{ github.run_attempt }}-integration
      PLATFORM_REDIS_URL: redis://:payvia-redis-${{ github.run_id }}-${{ github.run_attempt }}-integration@127.0.0.1:6379/0
      PLATFORM_DATABASE_URL: postgres://payvia_test:payvia-postgres-${{ github.run_id }}-${{ github.run_attempt }}-integration@127.0.0.1:5432/payvia_test?sslmode=disable
      PLATFORM_TEST_DATABASE_ADMIN_URL: postgres://payvia_test:payvia-postgres-${{ github.run_id }}-${{ github.run_attempt }}-integration@127.0.0.1:5432/payvia_test?sslmode=disable
      PLATFORM_NATS_URL: nats://127.0.0.1:4222
      NATS_USER: payvia_ci
      NATS_PASSWORD: payvia-platform-${{ github.run_id }}-${{ github.run_attempt }}-integration
    steps:
      - uses: actions/checkout@v7
      - name: Mask ephemeral service credentials
        run: |
          postgres_password="payvia-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-integration"
          echo "::add-mask::$postgres_password"
          echo "::add-mask::$REDIS_PASSWORD"
          echo "::add-mask::$NATS_PASSWORD"
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Start authenticated Redis for acceptance tests
        run: |
          docker run --detach --name payvia-shared-infra-redis-1 --publish 6379:6379 redis:8-alpine \
            redis-server --requirepass "$REDIS_PASSWORD"
          for attempt in $(seq 1 30); do
            if docker exec -e REDISCLI_AUTH="$REDIS_PASSWORD" payvia-shared-infra-redis-1 redis-cli ping | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          docker logs payvia-shared-infra-redis-1
          exit 1
      - name: Start authenticated JetStream for acceptance tests
        run: |
          docker run --detach --name payvia-shared-infra-nats-1 --publish 4222:4222 nats:2-alpine \
            -js --user "$NATS_USER" --pass "$NATS_PASSWORD"
          for attempt in $(seq 1 30); do
            if nc -z 127.0.0.1 4222; then
              exit 0
            fi
            sleep 1
          done
          docker logs payvia-shared-infra-nats-1
          exit 1
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: |
            frontends/frontend-pasarela/package-lock.json
            frontends/frontend-plataform/package-lock.json
      - name: Install and test tenant frontend
        working-directory: frontends/frontend-pasarela
        run: |
          npm ci
          npm test
          npm run build
      - name: Install and test platform frontend
        working-directory: frontends/frontend-plataform
        run: |
          npm ci
          npm test
          npm run build
      - name: Install Playwright Chromium headless shell for browser acceptance
        working-directory: frontends/frontend-pasarela
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 120000
        run: |
          timeout --signal=TERM --kill-after=30s 5m npx playwright install --only-shell --no-progress chromium
          npx playwright install --list
      - name: Provision isolated browser acceptance environment
        run: |
          umask 077
          cat > bacekend-plataform/.env <<EOF
          PLATFORM_TEST_DATABASE_ADMIN_URL=$PLATFORM_TEST_DATABASE_ADMIN_URL
          PLATFORM_REDIS_URL=$PLATFORM_REDIS_URL
          PLATFORM_NATS_URL=$PLATFORM_NATS_URL
          NATS_USER=$NATS_USER
          NATS_PASSWORD=$NATS_PASSWORD
          EOF
      - name: Browser E2E — tenant frontend
        working-directory: frontends/frontend-pasarela
        run: npm run test:e2e
      - name: Browser E2E — platform frontend
        working-directory: frontends/frontend-plataform
        run: npm run test:e2e
      - name: Browser E2E — multi-replica realtime recovery
        working-directory: frontends/frontend-plataform
        run: npm run test:e2e:recovery
      - name: Remove temporary E2E environment
        if: always()
        run: rm -f bacekend-plataform/.env
