name: Platform Rust quality

on:
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'bacekend-plataform/**'
      - '.github/workflows/platform-quality.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'bacekend-plataform/**'
      - '.github/workflows/platform-quality.yml'

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: payvia_test
          POSTGRES_USER: payvia_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payvia_test -d payvia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLATFORM_REDIS_URL: redis://127.0.0.1:6379/0
      PLATFORM_TEST_DATABASE_ADMIN_URL: postgres://payvia_test:test-only-password@127.0.0.1:5432/payvia_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
