name: Platform Rust quality

concurrency:
  group: platform-quality-phase3-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - feat/phase-3-catalog-entitlements
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'bacekend-plataform/**'
      - 'bacekend-pasarela/**'
      - 'crates/**'
      - 'frontends/**'
      - 'AGENTS.md'
      - 'PROJECT_RULES.md'
      - 'ROADMAP.md'
      - '.github/workflows/platform-quality.yml'
      - '**/*.md'
      - '**/*.mdx'
      - '**/docs/**'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'bacekend-plataform/**'
      - 'bacekend-pasarela/**'
      - 'crates/**'
      - 'frontends/**'
      - 'AGENTS.md'
      - 'PROJECT_RULES.md'
      - 'ROADMAP.md'
      - '.github/workflows/platform-quality.yml'
      - '**/*.md'
      - '**/*.mdx'
      - '**/docs/**'

permissions:
  contents: read

jobs:
  changes:
    name: Detect change scope
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.scope.outputs.code }}
      docs: ${{ steps.scope.outputs.docs }}
      workflows: ${{ steps.scope.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - id: scope
        name: Classify changed files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          code=false
          docs=false
          workflows=false

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "Initial push: running all verification scopes."
            code=true
            docs=true
            workflows=true
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            while IFS= read -r -d '' file; do
              printf 'Changed file: %s\n' "$file"
              case "$file" in
                *.md|*.mdx|*.markdown|*.MD|*.MDX|*.MARKDOWN|docs/*|*/docs/*|documentation/*|*/documentation/*)
                  docs=true
                  ;;
                .github/workflows/*.yml|.github/workflows/*.yaml)
                  workflows=true
                  ;;
                *)
                  code=true
                  ;;
              esac
            done < <(git diff --name-only --diff-filter=ACMRT -z "$BASE_SHA" "$HEAD_SHA")
          fi

          {
            echo "code=$code"
            echo "docs=$docs"
            echo "workflows=$workflows"
          } >> "$GITHUB_OUTPUT"

          echo "Verification scope: code=$code docs=$docs workflows=$workflows"

  documentation:
    name: Documentation checks
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Check documentation diff whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            git diff-tree --check --root "$HEAD_SHA"
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          fi
      - name: Phase 0 documentary acceptance
        run: python3 bacekend-plataform/scripts/audit_phase0_docs.py

  workflow-validation:
    name: Validate GitHub Actions workflow YAML
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Parse workflow YAML files
        run: |
          ruby -e 'require "yaml"; Dir.glob(".github/workflows/*.{yml,yaml}").sort.each { |path| YAML.parse_file(path); puts "Validated #{path}" }'

  quality:
    name: Platform Rust quality
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: payvia_test
          POSTGRES_USER: payvia_test
          POSTGRES_PASSWORD: payvia-postgres-${{ github.run_id }}-${{ github.run_attempt }}-integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payvia_test -d payvia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_PASSWORD: payvia-redis-${{ github.run_id }}-${{ github.run_attempt }}-integration
      PLATFORM_REDIS_URL: redis://:payvia-redis-${{ github.run_id }}-${{ github.run_attempt }}-integration@127.0.0.1:6379/0
      PLATFORM_DATABASE_URL: postgres://payvia_test:payvia-postgres-${{ github.run_id }}-${{ github.run_attempt }}-integration@127.0.0.1:5432/payvia_test?sslmode=disable
      PLATFORM_TEST_DATABASE_ADMIN_URL: postgres://payvia_test:payvia-postgres-${{ github.run_id }}-${{ github.run_attempt }}-integration@127.0.0.1:5432/payvia_test?sslmode=disable
      PLATFORM_NATS_URL: nats://127.0.0.1:4222
      NATS_USER: payvia_ci
      NATS_PASSWORD: payvia-platform-${{ github.run_id }}-${{ github.run_attempt }}-integration
    steps:
      - uses: actions/checkout@v7
      - name: Phase 0 documentary acceptance
        run: python3 bacekend-plataform/scripts/audit_phase0_docs.py
      - name: Mask ephemeral service credentials
        run: |
          postgres_password="payvia-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-integration"
          echo "::add-mask::$postgres_password"
          echo "::add-mask::$REDIS_PASSWORD"
          echo "::add-mask::$NATS_PASSWORD"
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Start authenticated Redis for acceptance tests
        run: |
          docker run --detach --name payvia-shared-infra-redis-1 --publish 6379:6379 redis:8-alpine \
            redis-server --requirepass "$REDIS_PASSWORD"
          for attempt in $(seq 1 30); do
            if docker exec -e REDISCLI_AUTH="$REDIS_PASSWORD" payvia-shared-infra-redis-1 redis-cli ping | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          docker logs payvia-shared-infra-redis-1
          exit 1
      - name: Start authenticated JetStream for acceptance tests
        run: |
          docker run --detach --name payvia-shared-infra-nats-1 --publish 4222:4222 nats:2-alpine \
            -js --user "$NATS_USER" --pass "$NATS_PASSWORD"
          for attempt in $(seq 1 30); do
            if nc -z 127.0.0.1 4222; then
              exit 0
            fi
            sleep 1
          done
          docker logs payvia-shared-infra-nats-1
          exit 1
      - name: Enforce Rust source file line limit
        shell: bash
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            lines=$(awk 'END { print NR }' "$file")
            if (( lines > 400 )); then
              printf 'Rust file exceeds 400 physical lines: %s (%s lines)\\n' "$file" "$lines"
              failed=1
            fi
          done < <(find bacekend-plataform bacekend-pasarela crates -type f -name '*.rs' -not -path '*/target/*' -print0)
          exit "$failed"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: |
            frontends/frontend-pasarela/package-lock.json
            frontends/frontend-plataform/package-lock.json
      - name: Install and test tenant frontend
        working-directory: frontends/frontend-pasarela
        run: |
          npm ci
          npm test
          npm run build
      - name: Install and test platform frontend
        working-directory: frontends/frontend-plataform
        run: |
          npm ci
          npm test
          npm run build
      - name: Install Playwright Chromium headless shell for browser acceptance
        working-directory: frontends/frontend-pasarela
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 120000
        run: |
          timeout --signal=TERM --kill-after=30s 5m npx playwright install --only-shell --no-progress chromium
          npx playwright install --list
      - name: Provision isolated browser acceptance environment
        run: |
          umask 077
          cat > bacekend-plataform/.env <<EOF
          PLATFORM_TEST_DATABASE_ADMIN_URL=$PLATFORM_TEST_DATABASE_ADMIN_URL
          PLATFORM_REDIS_URL=$PLATFORM_REDIS_URL
          PLATFORM_NATS_URL=$PLATFORM_NATS_URL
          NATS_USER=$NATS_USER
          NATS_PASSWORD=$NATS_PASSWORD
          EOF
      - name: Browser E2E — tenant frontend
        working-directory: frontends/frontend-pasarela
        run: npm run test:e2e
      - name: Browser E2E — platform frontend
        working-directory: frontends/frontend-plataform
        run: npm run test:e2e
      - name: Browser E2E — multi-replica realtime recovery
        working-directory: frontends/frontend-plataform
        run: npm run test:e2e:recovery
      - name: Remove temporary E2E environment
        if: always()
        run: rm -f bacekend-plataform/.env

# CI validation refresh for the current Phase 3 review head.
