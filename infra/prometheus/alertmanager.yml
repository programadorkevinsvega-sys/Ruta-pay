global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by: [alertname, service, environment]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id_file: /run/secrets/telegram_chat_id
        parse_mode: HTML
        send_resolved: true
