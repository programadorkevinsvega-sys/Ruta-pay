global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]

  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]

  - job_name: loki
    static_configs:
      - targets: [loki:3100]

  - job_name: otel-exported
    static_configs:
      - targets: [otel-collector:9464]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: nats
    static_configs:
      - targets: [nats-exporter:7777]

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: payvia-platform
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/platform_metrics_token
    file_sd_configs:
      - files: [/etc/prometheus/targets/platform.yml]
        refresh_interval: 30s

  - job_name: payvia-pasarela
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/pasarela_metrics_token
    file_sd_configs:
      - files: [/etc/prometheus/targets/pasarela.yml]
        refresh_interval: 30s
