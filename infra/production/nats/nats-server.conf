server_name: payvia-production-nats
port: 4222
http_port: 8222
max_connections: 10000
max_payload: 1048576
max_pending: 67108864
max_control_line: 4096
write_deadline: "10s"
ping_interval: "2m"
max_outstanding_pings: 5

tls {
  cert_file: "/run/tls/server.crt"
  key_file: "/run/tls/server.key"
  ca_file: "/run/tls/client-ca.pem"
  min_version: "1.2"
  verify_and_map: true
}

include ./auth/authorization.conf

jetstream {
  store_dir: "/data"
  max_mem_store: $NATS_MAX_MEM_STORE
  max_file_store: $NATS_MAX_FILE_STORE
}
