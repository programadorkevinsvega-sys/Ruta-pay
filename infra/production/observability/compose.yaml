name: payvia-production-observability

services:
  node-exporter:
    image: prom/node-exporter:v1.10.2
    restart: unless-stopped
    command: ["--path.procfs=/host/proc", "--path.sysfs=/host/sys", "--path.rootfs=/host"]
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:?set PROMETHEUS_RETENTION_TIME}
      - --web.enable-lifecycle
      - --web.config.file=/run/secrets/prometheus-web.yml
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ${PLATFORM_METRICS_TOKEN_FILE:?set PLATFORM_METRICS_TOKEN_FILE}:/run/secrets/platform_metrics_token:ro
      - ${PASARELA_METRICS_TOKEN_FILE:?set PASARELA_METRICS_TOKEN_FILE}:/run/secrets/pasarela_metrics_token:ro
      - ${PROMETHEUS_ADMIN_PASSWORD_FILE:?set PROMETHEUS_ADMIN_PASSWORD_FILE}:/run/secrets/prometheus_admin_password:ro
      - ${PROMETHEUS_WEB_CONFIG_FILE:?set PROMETHEUS_WEB_CONFIG_FILE}:/run/secrets/prometheus-web.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - node-exporter
      - otel-collector
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.34.2
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ../../prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${TELEGRAM_BOT_TOKEN_FILE:?set TELEGRAM_BOT_TOKEN_FILE}:/run/secrets/telegram_bot_token:ro
      - ${TELEGRAM_CHAT_ID_FILE:?set TELEGRAM_CHAT_ID_FILE}:/run/secrets/telegram_chat_id:ro
      - alertmanager_data:/alertmanager

  loki:
    image: grafana/loki:3.7.7
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ../../loki/config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

  tempo:
    image: grafana/tempo:3.1.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ../../tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo

  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.162.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ../../otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - loki
      - tempo

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: ${GRAFANA_PUBLIC_HOST:?set GRAFANA_PUBLIC_HOST}
      GF_SERVER_ROOT_URL: https://${GRAFANA_PUBLIC_HOST:?set GRAFANA_PUBLIC_HOST}/
      PROMETHEUS_ADMIN_USER: ${PROMETHEUS_ADMIN_USER:?set PROMETHEUS_ADMIN_USER}
      PROMETHEUS_ADMIN_PASSWORD: ${PROMETHEUS_ADMIN_PASSWORD:?set PROMETHEUS_ADMIN_PASSWORD}
    ports:
      - "192.0.2.70:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  prometheus_data:
  alertmanager_data:
  loki_data:
  tempo_data:
  grafana_data:
